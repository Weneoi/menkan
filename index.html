<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>门槛记录 - 全平台适配版</title>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        :root {
            --yong-color: #6c5ce7;
            --nian-color: #ff7675;
            --ban-color: #fab1a0;
            --tao-color: #00b894;
            --shui-color: #0984e3;
            --niudan-color: #fd79a8;
            --mengwu-zg: #ff9ff3;
            --mengwu-sy: #00cec9;
            --mengwu-nd: #fdcb6e;
            --bg: #f0f2f5;
            --card-bg: #ffffff;
            --radius: 12px;
            --shadow: 0 4px 12px rgba(0,0,0,0.1);
        }
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 12px;
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .main-layout {
            display: flex;
            gap: 16px;
            max-width: 1400px;
            margin: 0 auto;
            flex: 1;
            min-height: 0;
        }
        /* 左侧面板 */
        .input-panel {
            width: 340px;
            flex-shrink: 0;
            background: var(--card-bg);
            padding: 16px 18px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow-y: auto;
            max-height: calc(100vh - 24px);
            position: sticky;
            top: 12px;
            transition: 0.3s;
        }
        /* 右侧展示区 */
        .display-panel {
            flex: 1;
            overflow-y: auto;
            max-height: calc(100vh - 24px);
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 20px 24px;
        }
        /* 响应式断点 */
        @media (max-width: 820px) {
            body { padding: 8px; }
            .main-layout {
                flex-direction: column;
                gap: 12px;
            }
            .input-panel {
                width: 100%;
                max-height: none;
                position: static;
                padding: 14px 16px;
                border-radius: 10px;
            }
            .display-panel {
                max-height: none;
                padding: 14px 16px;
                border-radius: 10px;
            }
            .record-item {
                flex-direction: column;
                align-items: center;
                margin-left: 0;
                padding: 16px;
            }
            .record-img {
                width: 100%;
                max-height: 250px;
                object-fit: contain;
            }
            .record-name {
                font-size: 20px;
            }
            .record-amount {
                font-size: 22px;
                text-align: center;
            }
            .record-details {
                font-size: 14px;
            }
            .item-ops {
                position: static;
                justify-content: flex-end;
                margin-bottom: 10px;
                width: 100%;
            }
            .filter-zone label {
                font-size: 11px;
                margin-right: 8px;
            }
            .stats-table td {
                font-size: 13px;
            }
            .stat-number {
                font-size: 22px;
            }
            .category-title {
                font-size: 20px;
            }
            .sub-category-title {
                font-size: 16px;
                margin-left: 8px;
            }
            .btn-edit-small, .btn-del-small {
                font-size: 11px;
                padding: 4px 10px;
            }
        }
        @media (max-width: 480px) {
            .input-panel { padding: 10px 12px; }
            .display-panel { padding: 10px 12px; }
            .record-item { padding: 12px; gap: 12px; }
            .record-name { font-size: 18px; }
            .record-amount { font-size: 20px; }
            .tag { font-size: 10px; padding: 1px 6px; margin-left: 6px; }
            .stat-number { font-size: 20px; }
            .filter-zone { padding: 8px; }
            .filter-sub { margin-left: 8px; }
            button { font-size: 13px; padding: 10px; }
            input, select { padding: 8px; font-size: 14px; }
            .btn-img { margin-top: 12px; }
        }

        /* 表单样式 */
        .form-group {
            margin-bottom: 10px;
        }
        label {
            display: block;
            margin-bottom: 4px;
            font-size: 13px;
            font-weight: 600;
            color: #555;
        }
        input, select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            background: #fff;
            transition: 0.2s;
        }
        input:focus, select:focus {
            border-color: #6c5ce7;
            outline: none;
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.15);
        }
        button {
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 15px;
            transition: 0.2s;
            width: 100%;
            touch-action: manipulation;
        }
        button:active {
            transform: scale(0.97);
        }
        .btn-add { background: #2d3436; color: white; }
        .btn-update { background: #2ecc71; color: white; }
        .btn-cancel { background: #95a5a6; color: white; font-size: 13px; }
        .btn-img { background: #ff4d4f; color: white; margin-top: 16px; }
        .btn-backup { background: #00a8ff; color: white; font-size: 13px; width: 48%; }
        .btn-restore { background: #f1c40f; color: white; font-size: 13px; width: 48%; }

        .db-status {
            font-size: 12px;
            color: #2ecc71;
            margin-bottom: 10px;
            font-weight: 600;
        }
        .backup-zone {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 10px;
            border: 1px dashed #ccc;
            margin-bottom: 14px;
        }
        .backup-zone > div {
            display: flex;
            gap: 8px;
            justify-content: space-between;
        }

        .filter-zone {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #e9ecef;
            margin-bottom: 14px;
        }
        .filter-zone label {
            font-size: 12px;
            font-weight: normal;
            display: inline-flex;
            align-items: center;
            margin-right: 10px;
            cursor: pointer;
            padding: 2px 0;
        }
        .filter-zone input[type="checkbox"] {
            width: auto;
            margin-right: 4px;
            transform: scale(1.1);
        }
        .filter-group-title {
            font-size: 13px;
            font-weight: 700;
            color: #555;
            margin-bottom: 6px;
        }
        .filter-sub {
            margin-left: 16px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px 8px;
        }

        /* 展示区样式 */
        #export-area {
            background: transparent;
        }
        .header-info {
            text-align: center;
            margin-bottom: 16px;
        }
        .header-info h1 {
            margin: 0;
            font-size: 28px;
            color: #000;
            letter-spacing: 1px;
        }
        .header-sub {
            color: #666;
            font-size: 14px;
            margin-top: 6px;
        }
        .header-qq {
            color: #333;
            font-size: 16px;
            font-weight: bold;
            margin-top: 4px;
        }
        hr {
            border: 0;
            border-top: 2px solid #f0f0f0;
            margin: 20px 0;
        }
        .stats-table {
            width: 100%;
            border-collapse: collapse;
            margin: 16px 0;
        }
        .stats-table td {
            width: 50%;
            text-align: center;
            font-size: 15px;
            color: #666;
            padding: 4px 0;
        }
        .stat-number {
            color: #ff4d4f;
            font-size: 28px;
            font-weight: bold;
            display: block;
            margin-top: 4px;
        }

        .category-section {
            margin-bottom: 32px;
        }
        .category-title {
            font-size: 22px;
            font-weight: bold;
            color: #000;
            margin-bottom: 16px;
            border-left: 6px solid #ff4d4f;
            padding-left: 12px;
        }
        .sub-category-title {
            font-size: 18px;
            font-weight: bold;
            color: #555;
            margin: 16px 0 12px 16px;
            padding-left: 12px;
            border-left: 4px solid #00cec9;
        }
        .record-item {
            display: flex;
            gap: 24px;
            padding: 20px;
            border: 1px solid #f0f0f0;
            border-radius: 14px;
            margin-bottom: 20px;
            background: #fafafa;
            align-items: flex-start;
            position: relative;
            margin-left: 16px;
        }
        .record-img {
            width: 260px;
            height: auto;
            max-height: 350px;
            border-radius: 10px;
            object-fit: contain;
            background: #fff;
            border: 1px solid #eee;
            box-shadow: 0 4px 10px rgba(0,0,0,0.06);
            flex-shrink: 0;
        }
        .record-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 160px;
        }
        .record-name {
            font-size: 22px;
            font-weight: bold;
            color: #000;
            margin-bottom: 10px;
        }
        .record-details {
            font-size: 15px;
            color: #777;
            line-height: 2;
        }
        .record-amount {
            color: #2ecc71;
            font-size: 26px;
            font-weight: bold;
            margin-top: 16px;
            text-align: right;
        }
        .item-ops {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .btn-edit-small {
            background: #3498db;
            color: white;
            padding: 4px 12px;
            font-size: 12px;
            border-radius: 6px;
            width: auto;
            font-weight: 600;
        }
        .btn-del-small {
            background: #e74c3c;
            color: white;
            padding: 4px 12px;
            font-size: 12px;
            border-radius: 6px;
            width: auto;
            font-weight: 600;
        }
        .tag {
            font-size: 12px;
            padding: 2px 10px;
            border-radius: 4px;
            color: white;
            margin-left: 8px;
            vertical-align: middle;
            display: inline-block;
        }
        .tag-永会 { background: var(--yong-color); }
        .tag-年会 { background: var(--nian-color); }
        .tag-半年会 { background: var(--ban-color); }
        .tag-套会 { background: var(--tao-color); }
        .tag-水印会 { background: var(--shui-color); }
        .tag-扭蛋 { background: var(--niudan-color); }
        .tag-萌物番-直购 { background: var(--mengwu-zg); }
        .tag-萌物番-水印 { background: var(--mengwu-sy); }
        .tag-萌物番-扭蛋 { background: var(--mengwu-nd); }

        /* 滚动条美化 */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8;
        }
    </style>
</head>
<body>

<div class="main-layout">
    <!-- 左侧操作面板 -->
    <div class="input-panel">
        <div class="db-status">● 存储模式：无限量 IndexedDB</div>
        <h3 id="form-title" style="margin-top:0; font-size:18px;">📝 门槛记录录入</h3>

        <div class="form-group">
            <label>我的主QQ (必填)</label>
            <input type="text" id="userMainQQ" placeholder="必填" oninput="updateHeaderQQ(this.value)">
        </div>

        <div class="backup-zone">
            <label style="font-size:11px; color:#999;">数据存档管理</label>
            <div>
                <button class="btn-backup" onclick="exportJSON()">导出备份</button>
                <button class="btn-restore" onclick="document.getElementById('importFile').click()">导入备份</button>
            </div>
            <input type="file" id="importFile" style="display:none" accept=".json" onchange="importJSON(this)">
        </div>

        <hr style="margin:12px 0;">

        <div class="form-group">
            <label>类型</label>
            <select id="memberType">
                <option value="永会">永会</option>
                <option value="年会">年会</option>
                <option value="半年会">半年会</option>
                <option value="套会">套会</option>
                <option value="水印会">水印会</option>
                <option value="扭蛋">扭蛋</option>
                <option value="萌物番-直购">萌物番-直购</option>
                <option value="萌物番-水印">萌物番-水印</option>
                <option value="萌物番-扭蛋">萌物番-扭蛋</option>
            </select>
        </div>
        <div class="form-group">
            <label>会名 / 个人名</label>
            <input type="text" id="clubName" placeholder="输入名称">
        </div>
        <div class="form-group">
            <label>金额 (￥)</label>
            <input type="number" id="amount" value="0" step="0.01">
        </div>
        <div class="form-group">
            <label>关联 QQ</label>
            <input type="text" id="qqNumber" placeholder="默认同主QQ">
        </div>
        <div class="form-group">
            <label id="img-label">凭证大图</label>
            <input type="file" id="imageInput" accept="image/*">
        </div>

        <div id="action-buttons">
            <button id="submit-btn" class="btn-add" onclick="processAndSave()">确认保存</button>
        </div>

        <!-- 导出筛选 -->
        <div class="filter-zone">
            <div class="filter-group-title">📋 导出筛选（勾选要导出的分类）</div>
            <div style="display:flex; flex-wrap:wrap; gap:4px 6px;">
                <label><input type="checkbox" class="export-filter" value="永会" checked> 永会</label>
                <label><input type="checkbox" class="export-filter" value="年会" checked> 年会</label>
                <label><input type="checkbox" class="export-filter" value="半年会" checked> 半年会</label>
                <label><input type="checkbox" class="export-filter" value="套会" checked> 套会</label>
                <label><input type="checkbox" class="export-filter" value="水印会" checked> 水印会</label>
                <label><input type="checkbox" class="export-filter" value="扭蛋" checked> 扭蛋</label>
            </div>
            <div style="margin-top:4px; font-weight:bold; color:#0984e3; font-size:13px;">萌物番子类</div>
            <div class="filter-sub">
                <label><input type="checkbox" class="export-filter" value="萌物番-直购" checked> 直购</label>
                <label><input type="checkbox" class="export-filter" value="萌物番-水印" checked> 水印</label>
                <label><input type="checkbox" class="export-filter" value="萌物番-扭蛋" checked> 扭蛋</label>
            </div>
        </div>

        <button class="btn-img" onclick="exportToImage()">📸 导出超清长图（按筛选）</button>
        <button style="background:none; color:#ccc; font-size:11px; margin-top:12px; border:1px solid #eee; border-radius:6px;" onclick="clearAllData()">彻底清空数据库</button>
    </div>

    <!-- 右侧展示区 -->
    <div class="display-panel">
        <div id="export-area">
            <div class="header-info">
                <h1>门槛记录</h1>
                <div class="header-sub">档案生成日期：2026/7/13</div>
                <div class="header-qq" id="header-qq-display">QQ: 未设置</div>
            </div>
            <hr>
            <table class="stats-table">
                <tr>
                    <td>入会总数<br><strong class="stat-number" id="total-count">0</strong></td>
                    <td>累计支出<br><strong class="stat-number" id="total-amount">￥0.00</strong></td>
                </tr>
            </table>
            <hr>
            <div id="sections-container"></div>
        </div>
    </div>
</div>

<script>
    // --- IndexedDB 初始化 ---
    let db;
    const DB_NAME = "acodc_v14_db";
    const STORE_NAME = "records";
    let mainQQ = localStorage.getItem('acodc_v14_qq') || "";
    let editingId = null;

    const request = indexedDB.open(DB_NAME, 1);
    request.onupgradeneeded = e => {
        db = e.target.result;
        db.createObjectStore(STORE_NAME, { keyPath: "id", autoIncrement: true });
    };
    request.onsuccess = e => {
        db = e.target.result;
        if(mainQQ) {
            document.getElementById('userMainQQ').value = mainQQ;
            document.getElementById('header-qq-display').innerText = "QQ: " + mainQQ;
        }
        renderAll();
    };

    function updateHeaderQQ(val) {
        document.getElementById('header-qq-display').innerText = "QQ: " + (val || "未设置");
        localStorage.setItem('acodc_v14_qq', val);
        mainQQ = val;
    }

    // --- 数据操作 ---
    function processAndSave() {
        const name = document.getElementById('clubName').value.trim();
        const mQQ = document.getElementById('userMainQQ').value.trim();
        const sQQ = document.getElementById('qqNumber').value.trim();
        const fileInput = document.getElementById('imageInput');

        if (!name || (!mQQ && !sQQ)) { alert("请填写完整！"); return; }
        const finalQQ = sQQ || mQQ;

        if (fileInput.files && fileInput.files[0]) {
            const reader = new FileReader();
            reader.readAsDataURL(fileInput.files[0]);
            reader.onload = e => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const maxW = 1200;
                    const scale = Math.min(1, maxW / img.width);
                    canvas.width = img.width * scale;
                    canvas.height = img.height * scale;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    saveToDB(name, finalQQ, canvas.toDataURL('image/jpeg', 0.8));
                };
            };
        } else {
            if (editingId) {
                const transaction = db.transaction(STORE_NAME, "readonly");
                transaction.objectStore(STORE_NAME).get(editingId).onsuccess = e => {
                    saveToDB(name, finalQQ, e.target.result.img);
                };
            } else {
                saveToDB(name, finalQQ, '');
            }
        }
    }

    function saveToDB(name, qq, img) {
        const type = document.getElementById('memberType').value;
        const amount = parseFloat(document.getElementById('amount').value) || 0;
        const transaction = db.transaction(STORE_NAME, "readwrite");
        const store = transaction.objectStore(STORE_NAME);
        const data = { type, name, amount, qq, img, date: "2026/7/13" };
        if (editingId) { data.id = editingId; store.put(data); }
        else { store.add(data); }
        transaction.oncomplete = () => {
            alert("存档成功！");
            cancelEdit();
            renderAll();
        };
    }

    // --- 渲染 ---
    function renderAll() {
        const transaction = db.transaction(STORE_NAME, "readonly");
        const store = transaction.objectStore(STORE_NAME);
        store.getAll().onsuccess = e => {
            const records = e.target.result;
            const container = document.getElementById('sections-container');
            container.innerHTML = '';
            let totalSum = 0;

            const mainCategories = ["永会", "年会", "半年会", "套会", "水印会", "扭蛋", "萌物番"];
            const mengwuSubKeys = ["萌物番-直购", "萌物番-水印", "萌物番-扭蛋"];
            const subLabelMap = {
                "萌物番-直购": "直购",
                "萌物番-水印": "水印",
                "萌物番-扭蛋": "扭蛋"
            };

            mainCategories.forEach(mainCat => {
                let catRecords = [];
                if (mainCat === "萌物番") {
                    catRecords = records.filter(r => r.type && r.type.startsWith("萌物番-"));
                } else {
                    catRecords = records.filter(r => r.type === mainCat);
                }
                if (catRecords.length === 0) return;

                const section = document.createElement('div');
                section.className = 'category-section';
                if (mainCat === "萌物番") {
                    section.setAttribute('data-group', '萌物番');
                } else {
                    section.setAttribute('data-category', mainCat);
                }

                let html = `<div class="category-title">${mainCat}</div>`;

                if (mainCat === "萌物番") {
                    mengwuSubKeys.forEach(subKey => {
                        const subRecords = catRecords.filter(r => r.type === subKey);
                        if (subRecords.length === 0) return;
                        const subLabel = subLabelMap[subKey];
                        html += `<div class="sub-category-title" data-category="${subKey}">▸ ${subLabel}</div>`;
                        subRecords.forEach(r => {
                            totalSum += r.amount;
                            html += buildRecordHTML(r);
                        });
                    });
                } else {
                    catRecords.forEach(r => {
                        totalSum += r.amount;
                        html += buildRecordHTML(r);
                    });
                }

                section.innerHTML = html;
                container.appendChild(section);
            });

            document.getElementById('total-count').innerText = records.length;
            document.getElementById('total-amount').innerText = `￥${totalSum.toFixed(2)}`;
        };
    }

    function buildRecordHTML(r) {
        const imgHtml = r.img ? `<img src="${r.img}" class="record-img" loading="lazy">` :
            '<div style="width:260px;height:160px;background:#eee;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#999;font-size:14px;flex-shrink:0;">无凭证图</div>';
        return `
            <div class="record-item">
                <div class="item-ops" data-html2canvas-ignore="true">
                    <button class="btn-edit-small" onclick="startEdit(${r.id})">编辑</button>
                    <button class="btn-del-small" onclick="deleteRecord(${r.id})">删除</button>
                </div>
                ${imgHtml}
                <div class="record-content">
                    <div>
                        <div class="record-name">${r.name}<span class="tag tag-${r.type}">${r.type}</span></div>
                        <div class="record-details">关联 QQ：${r.qq}<br>存档时间：${r.date}</div>
                    </div>
                    <div class="record-amount">￥${r.amount.toFixed(2)}</div>
                </div>
            </div>
        `;
    }

    // --- 编辑与删除 ---
    function startEdit(id) {
        editingId = id;
        const transaction = db.transaction(STORE_NAME, "readonly");
        transaction.objectStore(STORE_NAME).get(id).onsuccess = e => {
            const r = e.target.result;
            document.getElementById('memberType').value = r.type;
            document.getElementById('clubName').value = r.name;
            document.getElementById('amount').value = r.amount;
            document.getElementById('qqNumber').value = r.qq;
            document.getElementById('form-title').innerText = "✏️ 正在编辑";
            document.getElementById('action-buttons').innerHTML = `
                <button class="btn-update" onclick="processAndSave()">确认修改</button>
                <button class="btn-cancel" onclick="cancelEdit()">取消编辑</button>
            `;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };
    }

    function cancelEdit() {
        editingId = null;
        document.getElementById('form-title').innerText = "📝 门槛记录录入";
        document.getElementById('action-buttons').innerHTML = `<button class="btn-add" onclick="processAndSave()">确认保存</button>`;
        document.getElementById('clubName').value = '';
        document.getElementById('amount').value = '0';
        document.getElementById('qqNumber').value = '';
        document.getElementById('imageInput').value = '';
    }

    function deleteRecord(id) {
        if(confirm("确定删除吗？")) {
            const transaction = db.transaction(STORE_NAME, "readwrite");
            transaction.objectStore(STORE_NAME).delete(id).onsuccess = () => renderAll();
        }
    }

    // --- 导出图片（精确统计） ---
    function exportToImage() {
        const checkboxes = document.querySelectorAll('.export-filter');
        const selected = new Set();
        checkboxes.forEach(cb => { if (cb.checked) selected.add(cb.value); });

        const transaction = db.transaction(STORE_NAME, "readonly");
        const store = transaction.objectStore(STORE_NAME);
        store.getAll().onsuccess = e => {
            const allRecords = e.target.result;
            const filteredRecords = allRecords.filter(r => selected.has(r.type));
            const totalCount = filteredRecords.length;
            let totalAmount = 0;
            filteredRecords.forEach(r => { totalAmount += r.amount; });

            const origCount = document.getElementById('total-count').innerText;
            const origAmount = document.getElementById('total-amount').innerText;

            document.getElementById('total-count').innerText = totalCount;
            document.getElementById('total-amount').innerText = `￥${totalAmount.toFixed(2)}`;

            const sections = document.querySelectorAll('.category-section');
            sections.forEach(section => {
                const group = section.getAttribute('data-group');
                const cat = section.getAttribute('data-category');
                if (group === '萌物番') {
                    const subTitles = section.querySelectorAll('.sub-category-title');
                    let anySubVisible = false;
                    subTitles.forEach(sub => {
                        const subCat = sub.getAttribute('data-category');
                        if (selected.has(subCat)) {
                            sub.style.display = '';
                            let next = sub.nextElementSibling;
                            while (next && next.classList && next.classList.contains('record-item')) {
                                next.style.display = '';
                                next = next.nextElementSibling;
                            }
                            anySubVisible = true;
                        } else {
                            sub.style.display = 'none';
                            let next = sub.nextElementSibling;
                            while (next && next.classList && next.classList.contains('record-item')) {
                                next.style.display = 'none';
                                next = next.nextElementSibling;
                            }
                        }
                    });
                    section.style.display = anySubVisible ? '' : 'none';
                } else {
                    section.style.display = selected.has(cat) ? '' : 'none';
                }
            });

            const area = document.getElementById('export-area');
            html2canvas(area, {
                useCORS: true,
                scale: 3,
                backgroundColor: "#ffffff"
            }).then(canvas => {
                document.getElementById('total-count').innerText = origCount;
                document.getElementById('total-amount').innerText = origAmount;
                sections.forEach(s => s.style.display = '');
                const a = document.createElement('a');
                a.download = `超清门槛记录_${Date.now()}.png`;
                a.href = canvas.toDataURL("image/png");
                a.click();
            }).catch(err => {
                document.getElementById('total-count').innerText = origCount;
                document.getElementById('total-amount').innerText = origAmount;
                sections.forEach(s => s.style.display = '');
                alert("导出失败，请查看控制台错误信息。");
                console.error(err);
            });
        };
    }

    // --- 备份与导入 ---
    function exportJSON() {
        const transaction = db.transaction(STORE_NAME, "readonly");
        transaction.objectStore(STORE_NAME).getAll().onsuccess = e => {
            const blob = new Blob([JSON.stringify({ mainQQ, records: e.target.result })], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `门槛备份_${new Date().toLocaleDateString()}.json`;
            a.click();
        };
    }

    function importJSON(input) {
        const reader = new FileReader();
        reader.onload = e => {
            const data = JSON.parse(e.target.result);
            const transaction = db.transaction(STORE_NAME, "readwrite");
            const store = transaction.objectStore(STORE_NAME);
            store.clear().onsuccess = () => {
                data.records.forEach(r => { delete r.id; store.add(r); });
                localStorage.setItem('acodc_v14_qq', data.mainQQ || "");
                alert("导入成功！");
                location.reload();
            };
        };
        reader.readAsText(input.files[0]);
    }

    function clearAllData() {
        if(confirm("确定彻底清空吗？")) {
            const transaction = db.transaction(STORE_NAME, "readwrite");
            transaction.objectStore(STORE_NAME).clear().onsuccess = () => location.reload();
        }
    }
</script>
</body>
</html>
